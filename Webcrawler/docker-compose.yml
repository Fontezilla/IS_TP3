version: '3.8'

services:
  webcrawler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ren-webcrawler
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - webcrawler-network

networks:
  webcrawler-network:
    driver: bridge
