version: "3.8"

networks:
  biservice-network:
    driver: bridge

services:
  biservice:
    build: .
    container_name: biservice
    ports:
      - "8080:8080"
    depends_on:
      xmlservice:
        condition: service_healthy
    environment:
      - XMLSERVICE_ADDR=xmlservice:50051
      - SPRING_GRAPHQL_PATH=/graphql
      - SERVER_PORT=8080
    networks:
      - biservice-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  xmlservice:
    image: xmlservice:latest
    container_name: xmlservice
    ports:
      - "50051:50051"
    networks:
      - biservice-network
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "localhost:50051", "list"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
