<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto BI Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        header p {
            color: #888;
        }

        .config-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .config-panel h3 {
            margin-bottom: 15px;
            color: #00d4ff;
        }

        .config-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .config-group {
            flex: 1;
            min-width: 200px;
        }

        .config-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .config-group input, .config-group select {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
        }

        .config-group input:focus, .config-group select:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-full {
            grid-column: 1 / -1;
        }

        .card h3 {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h3 .icon {
            font-size: 1.5rem;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .card-full .chart-container {
            height: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            color: #00d4ff;
            font-weight: 600;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .positive {
            color: #00ff88;
        }

        .negative {
            color: #ff4757;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid #ff4757;
            border-radius: 8px;
            padding: 15px;
            color: #ff4757;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-left: 10px;
        }

        .status-ok {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .status-error {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d4ff;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .config-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Crypto BI Dashboard</h1>
            <p>Visualizacao de dados de criptomoedas via GraphQL</p>
        </header>

        <div class="config-panel">
            <h3>Configuracao</h3>
            <div class="config-row">
                <div class="config-group">
                    <label>GraphQL Endpoint</label>
                    <input type="text" id="endpoint" value="http://localhost:8081/graphql">
                </div>
                <div class="config-group">
                    <label>Ticker (Evolucao Preco)</label>
                    <input type="text" id="ticker" value="BTC" placeholder="Ex: BTC, ETH">
                </div>
                <div class="config-group">
                    <label>Data Inicio</label>
                    <input type="datetime-local" id="dateFrom" value="2026-01-01T00:00">
                </div>
                <div class="config-group">
                    <label>Data Fim</label>
                    <input type="datetime-local" id="dateTo" value="2026-12-31T23:59">
                </div>
                <div class="config-group">
                    <label>Limit Ranking</label>
                    <input type="number" id="limit" value="10" min="1" max="100">
                </div>
                <div class="config-group" style="display: flex; gap: 10px; align-items: flex-end;">
                    <button class="btn btn-primary" onclick="loadAllData()">Carregar Dados</button>
                    <button class="btn btn-secondary" onclick="clearData()">Limpar</button>
                </div>
            </div>
        </div>

        <div class="dashboard">
            <!-- Evolucao de Preco -->
            <div class="card card-full">
                <h3>
                    <span class="icon">📈</span>
                    Evolucao de Preco
                    <span id="priceStatus" class="status"></span>
                </h3>
                <div class="stats-grid" id="priceStats"></div>
                <div class="chart-container">
                    <canvas id="priceChart"></canvas>
                </div>
                <div id="priceError" class="error" style="display: none;"></div>
            </div>

            <!-- Ranking Dominancia -->
            <div class="card">
                <h3>
                    <span class="icon">🏆</span>
                    Ranking Dominancia
                    <span id="rankingStatus" class="status"></span>
                </h3>
                <div class="chart-container">
                    <canvas id="rankingChart"></canvas>
                </div>
                <div id="rankingError" class="error" style="display: none;"></div>
            </div>

            <!-- Preco Medio -->
            <div class="card">
                <h3>
                    <span class="icon">💰</span>
                    Preco Medio por Ativo
                    <span id="avgStatus" class="status"></span>
                </h3>
                <div id="avgTableContainer">
                    <table id="avgTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Ticker</th>
                                <th>Preco Medio</th>
                            </tr>
                        </thead>
                        <tbody id="avgTableBody">
                        </tbody>
                    </table>
                </div>
                <div id="avgError" class="error" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        // Configuracao dos graficos
        Chart.defaults.color = '#888';
        Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.1)';

        let priceChart = null;
        let rankingChart = null;

        // Funcao para fazer queries GraphQL
        async function graphqlQuery(query, variables = {}) {
            const endpoint = document.getElementById('endpoint').value;

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ query, variables })
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const result = await response.json();

            if (result.errors) {
                throw new Error(result.errors[0].message);
            }

            return result.data;
        }

        // Formatar data para ISO
        function formatDateISO(dateStr) {
            return new Date(dateStr).toISOString();
        }

        // Formatar numero como moeda
        function formatCurrency(value) {
            if (value >= 1000000000) {
                return '$' + (value / 1000000000).toFixed(2) + 'B';
            } else if (value >= 1000000) {
                return '$' + (value / 1000000).toFixed(2) + 'M';
            } else if (value >= 1000) {
                return '$' + (value / 1000).toFixed(2) + 'K';
            }
            return '$' + value.toFixed(2);
        }

        // Formatar percentagem
        function formatPercent(value) {
            return value.toFixed(4) + '%';
        }

        // Carregar Evolucao de Preco
        async function loadEvolucaoPreco() {
            const ticker = document.getElementById('ticker').value;
            const from = formatDateISO(document.getElementById('dateFrom').value);
            const to = formatDateISO(document.getElementById('dateTo').value);
            const statusEl = document.getElementById('priceStatus');
            const errorEl = document.getElementById('priceError');
            const statsEl = document.getElementById('priceStats');

            statusEl.textContent = 'A carregar...';
            statusEl.className = 'status';
            errorEl.style.display = 'none';

            try {
                const query = `
                    query EvolucaoPreco($ticker: String!, $from: String!, $to: String!) {
                        evolucaoPreco(ticker: $ticker, from: $from, to: $to) {
                            timestamp
                            preco
                        }
                    }
                `;

                const data = await graphqlQuery(query, { ticker, from, to });
                const items = data.evolucaoPreco;

                if (items.length === 0) {
                    throw new Error('Nenhum dado encontrado para o periodo selecionado');
                }

                // Calcular estatisticas
                const precos = items.map(i => i.preco);
                const minPreco = Math.min(...precos);
                const maxPreco = Math.max(...precos);
                const avgPreco = precos.reduce((a, b) => a + b, 0) / precos.length;
                const variation = ((precos[precos.length - 1] - precos[0]) / precos[0] * 100);

                statsEl.innerHTML = `
                    <div class="stat-item">
                        <div class="stat-value">${formatCurrency(precos[precos.length - 1])}</div>
                        <div class="stat-label">Ultimo Preco</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${formatCurrency(minPreco)}</div>
                        <div class="stat-label">Minimo</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${formatCurrency(maxPreco)}</div>
                        <div class="stat-label">Maximo</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value ${variation >= 0 ? 'positive' : 'negative'}">${variation >= 0 ? '+' : ''}${variation.toFixed(2)}%</div>
                        <div class="stat-label">Variacao</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${items.length}</div>
                        <div class="stat-label">Registos</div>
                    </div>
                `;

                // Criar grafico
                const ctx = document.getElementById('priceChart').getContext('2d');

                if (priceChart) {
                    priceChart.destroy();
                }

                priceChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: items.map(i => new Date(i.timestamp).toLocaleDateString('pt-PT')),
                        datasets: [{
                            label: `${ticker} Preco (USD)`,
                            data: items.map(i => i.preco),
                            borderColor: '#00d4ff',
                            backgroundColor: 'rgba(0, 212, 255, 0.1)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: items.length > 50 ? 0 : 3,
                            pointHoverRadius: 5
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top'
                            },
                            tooltip: {
                                callbacks: {
                                    label: (ctx) => formatCurrency(ctx.raw)
                                }
                            }
                        },
                        scales: {
                            y: {
                                ticks: {
                                    callback: (value) => formatCurrency(value)
                                }
                            }
                        }
                    }
                });

                statusEl.textContent = 'OK';
                statusEl.className = 'status status-ok';

            } catch (error) {
                statusEl.textContent = 'Erro';
                statusEl.className = 'status status-error';
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
                statsEl.innerHTML = '';
            }
        }

        // Carregar Ranking Dominancia
        async function loadRankingDominancia() {
            const limit = parseInt(document.getElementById('limit').value);
            const statusEl = document.getElementById('rankingStatus');
            const errorEl = document.getElementById('rankingError');

            statusEl.textContent = 'A carregar...';
            statusEl.className = 'status';
            errorEl.style.display = 'none';

            try {
                const query = `
                    query RankingDominancia($limit: Int) {
                        rankingDominancia(limit: $limit) {
                            ticker
                            dominancia
                        }
                    }
                `;

                const data = await graphqlQuery(query, { limit });
                const items = data.rankingDominancia;

                if (items.length === 0) {
                    throw new Error('Nenhum dado de dominancia encontrado');
                }

                // Criar grafico de barras horizontais
                const ctx = document.getElementById('rankingChart').getContext('2d');

                if (rankingChart) {
                    rankingChart.destroy();
                }

                const colors = [
                    '#00d4ff', '#7b2cbf', '#00ff88', '#ff4757', '#ffa502',
                    '#2ed573', '#1e90ff', '#ff6b81', '#a55eea', '#26de81'
                ];

                rankingChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: items.map(i => i.ticker),
                        datasets: [{
                            label: 'Dominancia (%)',
                            data: items.map(i => i.dominancia),
                            backgroundColor: items.map((_, idx) => colors[idx % colors.length]),
                            borderRadius: 5
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: (ctx) => formatPercent(ctx.raw)
                                }
                            }
                        },
                        scales: {
                            x: {
                                ticks: {
                                    callback: (value) => value + '%'
                                }
                            }
                        }
                    }
                });

                statusEl.textContent = 'OK';
                statusEl.className = 'status status-ok';

            } catch (error) {
                statusEl.textContent = 'Erro';
                statusEl.className = 'status status-error';
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
            }
        }

        // Carregar Preco Medio
        async function loadPrecoMedio() {
            const from = formatDateISO(document.getElementById('dateFrom').value);
            const to = formatDateISO(document.getElementById('dateTo').value);
            const statusEl = document.getElementById('avgStatus');
            const errorEl = document.getElementById('avgError');
            const tableBody = document.getElementById('avgTableBody');

            statusEl.textContent = 'A carregar...';
            statusEl.className = 'status';
            errorEl.style.display = 'none';

            try {
                const query = `
                    query PrecoMedio($from: String!, $to: String!) {
                        precoMedio(from: $from, to: $to) {
                            ticker
                            precoMedio
                        }
                    }
                `;

                const data = await graphqlQuery(query, { from, to });
                const items = data.precoMedio;

                if (items.length === 0) {
                    throw new Error('Nenhum dado de preco medio encontrado');
                }

                // Preencher tabela
                tableBody.innerHTML = items.map((item, idx) => `
                    <tr>
                        <td>${idx + 1}</td>
                        <td><strong>${item.ticker}</strong></td>
                        <td>${formatCurrency(item.precoMedio)}</td>
                    </tr>
                `).join('');

                statusEl.textContent = 'OK';
                statusEl.className = 'status status-ok';

            } catch (error) {
                statusEl.textContent = 'Erro';
                statusEl.className = 'status status-error';
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
                tableBody.innerHTML = '';
            }
        }

        // Carregar todos os dados
        async function loadAllData() {
            await Promise.all([
                loadEvolucaoPreco(),
                loadRankingDominancia(),
                loadPrecoMedio()
            ]);
        }

        // Limpar dados
        function clearData() {
            if (priceChart) {
                priceChart.destroy();
                priceChart = null;
            }
            if (rankingChart) {
                rankingChart.destroy();
                rankingChart = null;
            }
            document.getElementById('avgTableBody').innerHTML = '';
            document.getElementById('priceStats').innerHTML = '';

            ['priceStatus', 'rankingStatus', 'avgStatus'].forEach(id => {
                document.getElementById(id).textContent = '';
                document.getElementById(id).className = 'status';
            });

            ['priceError', 'rankingError', 'avgError'].forEach(id => {
                document.getElementById(id).style.display = 'none';
            });
        }

        // Carregar dados ao iniciar
        document.addEventListener('DOMContentLoaded', () => {
            // Definir datas padrao
            const now = new Date();
            const yearStart = new Date(now.getFullYear(), 0, 1);

            document.getElementById('dateFrom').value = yearStart.toISOString().slice(0, 16);
            document.getElementById('dateTo').value = now.toISOString().slice(0, 16);
        });
    </script>
</body>
</html>
