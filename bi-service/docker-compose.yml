version: "3.8"

services:
  biservice:
    build: .
    container_name: biservice
    network_mode: host
    environment:
      - GRPC_XML_REPOSITORY_ADDRESS=${GRPC_XML_REPOSITORY_ADDRESS:-localhost}
      - GRPC_XML_REPOSITORY_PORT=${GRPC_XML_REPOSITORY_PORT:-50051}
      - SERVER_PORT=8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
