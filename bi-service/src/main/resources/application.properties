# Server Configuration
server.port=8081
spring.application.name=BIService

# GraphQL Configuration
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=true
spring.graphql.cors.allowed-origins=*
spring.graphql.cors.allowed-methods=GET,POST

# gRPC Client Configuration
grpc.client.xml-repository.address=${GRPC_XML_REPOSITORY_ADDRESS:localhost}
grpc.client.xml-repository.port=${GRPC_XML_REPOSITORY_PORT:50051}

# Logging
logging.level.root=INFO
logging.level.com.tp3.biservice=DEBUG
logging.level.io.grpc=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
